<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ddelux CRM | הזמנת משתמש</title>
    <style>
      :root { color-scheme: dark; --sand-50: #f7f3ee; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: var(--sand-50);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(122,166,194,0.25), transparent 60%),
          radial-gradient(900px 500px at 90% 0%, rgba(202,164,94,0.2), transparent 55%),
          linear-gradient(180deg, #0b0c10 0%, #101216 40%, #0b0c10 100%);
        font-family: "Assistant", "Segoe UI", system-ui, sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      .page { padding: 40px 24px 80px; }
      .container { max-width: 900px; margin: 0 auto; }
      .glass {
        background: linear-gradient(135deg, rgba(16,18,22,0.9), rgba(22,26,33,0.6));
        border: 1px solid rgba(214,182,118,0.18); border-radius: 28px; padding: 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      .field { display: grid; gap: 8px; margin-top: 16px; }
      .input, .select {
        width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05); padding: 12px 14px; color: var(--sand-50);
      }
      .cta {
        border-radius: 999px; border: 1px solid rgba(214,182,118,0.4);
        background: rgba(202,164,94,0.2); padding: 10px 18px; font-weight: 600;
        display: inline-flex; gap: 8px; margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container">
        <section class="glass">
          <h1 style="margin: 0;">הזמנת משתמש</h1>
          <p style="color: rgba(239,231,220,0.75);">שליחת הזמנה מאובטחת לצוות חדש.</p>
          <div class="field">
            <label>אימייל</label>
            <input class="input" placeholder="name@ddelux.com" />
          </div>
          <div class="field">
            <label>תפקיד</label>
            <select class="select">
              <option>Admin</option>
              <option>Manager</option>
              <option>Agent</option>
            </select>
          </div>
          <a class="cta" href="settings-users.html">שלח הזמנה</a>
          <a class="cta" href="settings-users.html">ביטול</a>
        </section>
      </div>
    </div>
  </body>
</html>
