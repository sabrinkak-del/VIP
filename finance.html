<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ddelux CRM | פיננסים</title>
    <style>
      :root { color-scheme: dark; --sand-50: #f7f3ee; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: var(--sand-50);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(122,166,194,0.25), transparent 60%),
          radial-gradient(900px 500px at 90% 0%, rgba(202,164,94,0.2), transparent 55%),
          linear-gradient(180deg, #0b0c10 0%, #101216 40%, #0b0c10 100%);
        font-family: "Assistant", "Segoe UI", system-ui, sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      .page { padding: 40px 24px 80px; }
      .container { max-width: 1100px; margin: 0 auto; }
      .nav {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
        border-radius: 999px; padding: 12px 24px; backdrop-filter: blur(10px);
      }
      .logo { display: flex; align-items: center; gap: 12px; }
      .logo-badge {
        width: 40px; height: 40px; border-radius: 50%;
        border: 1px solid rgba(214,182,118,0.4); background: rgba(214,182,118,0.2);
        display: grid; place-items: center; font-weight: 700;
      }
      .nav-links { display: none; gap: 24px; font-size: 14px; color: rgba(239,231,220,0.8); }
      .cta {
        border-radius: 999px; border: 1px solid rgba(214,182,118,0.4);
        background: rgba(202,164,94,0.2); padding: 10px 18px; font-weight: 600;
      }
      .glass {
        background: linear-gradient(135deg, rgba(16,18,22,0.9), rgba(22,26,33,0.6));
        border: 1px solid rgba(214,182,118,0.18); border-radius: 28px; padding: 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      .grid { display: grid; gap: 16px; margin-top: 20px; }
      .card {
        border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
        border-radius: 20px; padding: 16px;
      }
      @media (min-width: 900px) {
        .nav-links { display: flex; }
        .grid { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container">
        <header class="nav">
          <div class="logo">
            <div class="logo-badge">D</div>
            <div>
              <div style="font-weight: 700;">Ddelux</div>
              <div style="font-size: 12px; color: rgba(239,231,220,0.7);">CRM נדל״ן יוקרתי</div>
            </div>
          </div>
          <nav class="nav-links">
            <a href="index.html">לוח בקרה</a>
            <a href="properties.html">נכסים</a>
            <a href="clients.html">לקוחות</a>
            <a href="finance.html">פיננסים</a>
            <a href="tasks.html">משימות</a>
            <a href="settings.html">הגדרות</a>
          </nav>
          <a class="cta" href="settings.html">הגדרות פיננסיות</a>
        </header>

        <section class="glass" style="margin-top: 28px;">
          <h1 style="margin: 0;">ניתוח פיננסי</h1>
          <p style="color: rgba(239,231,220,0.75);">תמונה פיננסית מלאה ותחזית עסקאות.</p>
          <div class="grid">
            <a class="card" href="finance.html">
              <div style="font-size: 12px; color: rgba(239,231,220,0.6);">הכנסות חודשיות</div>
              <div style="font-weight: 700; font-size: 20px;">₪42.8M</div>
            </a>
            <a class="card" href="finance.html">
              <div style="font-size: 12px; color: rgba(239,231,220,0.6);">עמלות פתוחות</div>
              <div style="font-weight: 700; font-size: 20px;">₪11.2M</div>
            </a>
            <a class="card" href="finance.html">
              <div style="font-size: 12px; color: rgba(239,231,220,0.6);">ROI ממוצע</div>
              <div style="font-weight: 700; font-size: 20px;">18.4%</div>
            </a>
            <a class="card" href="finance.html">
              <div style="font-size: 12px; color: rgba(239,231,220,0.6);">תזרים 90 יום</div>
              <div style="font-weight: 700; font-size: 20px;">₪76M</div>
            </a>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
